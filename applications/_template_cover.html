<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover Letter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root {
    --navy: #0d1b2a;
    --accent: #1a73b5;
    --text: #1a1a2e;
    --muted: #5a6a7e;
    --rule: #c8d4e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #e8ecf0;
    color: var(--text);
    font-size: 10.5pt;
    line-height: 1.6;
  }
  .page {
    background: white;
    max-width: 760px;
    margin: 32px auto;
    padding: 48px 56px;
    box-shadow: 0 4px 40px rgba(0,0,0,0.14);
  }
  .header-name { font-size: 20pt; font-weight: 800; color: var(--navy); letter-spacing: -0.4px; }
  .header-contact { margin-top: 6px; font-size: 8.8pt; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .header-contact a { color: var(--accent); text-decoration: none; }
  .divider { border: none; border-top: 1.5px solid var(--accent); margin: 18px 0 22px; }
  .date { font-size: 9.5pt; color: var(--muted); margin-bottom: 18px; }
  .addressee { font-size: 9.8pt; color: var(--text); margin-bottom: 18px; line-height: 1.5; }
  .body p { margin-bottom: 13px; font-size: 9.8pt; }
  .sign-off { margin-top: 6px; font-size: 9.8pt; }
  @media print {
    body { background: white; }
    .page { margin: 0; padding: 40px 48px; box-shadow: none; max-width: 100%; }
  }
</style>
</head>
<body>
<div class="page">
  <!-- ONE-TIME SETUP: replace the four lines below with your own details.
       These stay fixed for every application; only the {{...}} slots are
       filled per-job by tailor.py. -->
  <div class="header-name">YOUR NAME</div>
  <div class="header-contact">
    <span>YOUR CITY</span>
    <span>YOUR PHONE</span>
    <a href="mailto:you@example.com">you@example.com</a>
    <a href="https://www.linkedin.com/in/your-handle/" target="_blank">linkedin.com/in/your-handle</a>
  </div>
  <hr class="divider">
  <div class="date">{{DATE}}</div>
  <div class="addressee">{{ADDRESSEE}}</div>
  <div class="body">
    <p>{{P1}}</p>
    <p>{{P2}}</p>
    <p>{{P3}}</p>
    <p>{{P4}}</p>
  </div>
  <div class="sign-off">
    Regards,<br>
    YOUR NAME
  </div>
</div>
</body>
</html>
